name: Paper-trading bot

# One run lasts up to ~5.5 hours; a run is scheduled every hour and the concurrency group keeps exactly one running
# (the next one waits and starts as soon as the current one ends), so the bot watches the markets continuously.
# A push of new bot code queues a run; the running bot notices the new code within 10 minutes and hands over.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/**", "requirements.txt"]
  workflow_dispatch:

concurrency:
  group: paper-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # Raw data goes to a private repository whose name and access token are secrets (never printed: GitHub masks them).
      HAS_PRIVATE: ${{ secrets.PRIVATE_REPO_TOKEN != '' && secrets.PRIVATE_REPO != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check out the private data repository
        if: env.HAS_PRIVATE == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          sparse-checkout: data/bot_raw

      - name: Run the bot
        env:
          BOT_COMMIT: "1"
          MAX_RUNTIME_MIN: "335"
          BOT_RAW_DIR: ${{ env.HAS_PRIVATE == 'true' && 'private/data/bot_raw' || '' }}
          BOT_RAW_REPO: ${{ env.HAS_PRIVATE == 'true' && 'private' || '' }}
          ODDS_API_KEY_1: ${{ secrets.ODDS_API_KEY_1 }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
        run: |
          git config user.name "tfg-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d private ]; then
            git -C private config user.name "tfg-paper-bot"
            git -C private config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          python -m bot.bot
