name: Paper-trading bot

# One run lasts up to ~5.5 hours; a run is scheduled every hour and the concurrency group keeps exactly one running
# (the next one waits and starts as soon as the current one ends), so the bot watches the markets continuously.
# GitHub's schedule is best effort and has skipped hours, so each run also queues its successor when it starts.
# A push of new bot code queues a run; the running bot notices the new code within 10 minutes and hands over.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/**", "requirements.txt"]
  workflow_dispatch:

concurrency:
  group: paper-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write      # lets each run queue the next one (step "Queue the next run")

jobs:
  bot:
    # On/off switch: the bot runs unless the repository variable BOT_ENABLED is "false"
    # (Settings -> Secrets and variables -> Actions -> Variables). To stop it: create BOT_ENABLED = false (every later run
    # is skipped at once) and cancel the run in progress from the Actions tab; or disable the workflow in the Actions tab.
    if: vars.BOT_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # Raw data goes to a private repository whose name and access token are secrets (never printed: GitHub masks them).
      HAS_PRIVATE: ${{ secrets.PRIVATE_REPO_TOKEN != '' && secrets.PRIVATE_REPO != '' }}
    steps:
      # GitHub's hourly schedule is best effort: on 19 Nov no run was started between 09:25 and 10:58 UTC. Each run
      # therefore queues its successor as soon as it starts; the concurrency group keeps it waiting until this run ends.
      # No successor is queued after the planned end of the live sample (STOP_AT).
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
          STOP_AT: "2026-11-23T06:00:00Z"
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d "$STOP_AT" +%s)" ]; then
            gh workflow run bot.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "could not queue the next run"
          else
            echo "after STOP_AT: no successor queued"
          fi

      # Always the latest commit of main: a run queued an hour earlier must not start from the results of that time
      # (it would load an old state and drop the rows written since).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check out the private data repository
        if: env.HAS_PRIVATE == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          sparse-checkout: data/bot_raw

      - name: Run the bot
        env:
          BOT_COMMIT: "1"
          MAX_RUNTIME_MIN: "335"
          # Bookmaker odds (The Odds API): each call costs markets x regions credits. From 18 Nov: European bookmakers
          # also for US sports, and US bookmakers also for football; credits only need to last until BOOK_END.
          BOOK_REGIONS_US: "us,eu"
          BOOK_REGIONS_FB: "uk,eu,us"
          BOOK_END: "2026-11-23T06:00:00Z"
          BOT_RAW_DIR: ${{ env.HAS_PRIVATE == 'true' && 'private/data/bot_raw' || '' }}
          BOT_RAW_REPO: ${{ env.HAS_PRIVATE == 'true' && 'private' || '' }}
          ODDS_API_KEY_1: ${{ secrets.ODDS_API_KEY_1 }}
          ODDS_API_KEY_2: ${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }}
          ODDS_API_KEY_4: ${{ secrets.ODDS_API_KEY_4 }}
          ODDS_API_KEY_5: ${{ secrets.ODDS_API_KEY_5 }}
          ODDS_API_KEY_6: ${{ secrets.ODDS_API_KEY_6 }}
          ODDS_API_KEY_7: ${{ secrets.ODDS_API_KEY_7 }}
          ODDS_API_KEY_8: ${{ secrets.ODDS_API_KEY_8 }}
          ODDS_API_KEY_9: ${{ secrets.ODDS_API_KEY_9 }}
          ODDS_API_KEY_10: ${{ secrets.ODDS_API_KEY_10 }}
          ODDS_API_KEY_11: ${{ secrets.ODDS_API_KEY_11 }}
          ODDS_API_KEY_12: ${{ secrets.ODDS_API_KEY_12 }}
          ODDS_API_KEY_13: ${{ secrets.ODDS_API_KEY_13 }}
          ODDS_API_KEY_14: ${{ secrets.ODDS_API_KEY_14 }}
          ODDS_API_KEY_15: ${{ secrets.ODDS_API_KEY_15 }}
          ODDS_API_KEY_16: ${{ secrets.ODDS_API_KEY_16 }}
          ODDS_API_KEY_17: ${{ secrets.ODDS_API_KEY_17 }}
          ODDS_API_KEY_18: ${{ secrets.ODDS_API_KEY_18 }}
          ODDS_API_KEY_19: ${{ secrets.ODDS_API_KEY_19 }}
          ODDS_API_KEY_20: ${{ secrets.ODDS_API_KEY_20 }}
        run: |
          git config user.name "tfg-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d private ]; then
            git -C private config user.name "tfg-paper-bot"
            git -C private config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          python -m bot.bot
